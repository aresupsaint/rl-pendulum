name: Train inverted pendulum TD3

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Gymnasium environment
        required: true
        type: choice
        options:
          - InvertedPendulum-v5
          - InvertedDoublePendulum-v5
          - Pendulum-v1
      steps:
        description: Training environment steps
        required: true
        type: number
        default: 50000
      seed:
        description: Random seed
        required: true
        type: number
        default: 0

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      RL_ENV: ${{ inputs.environment }}
      RL_STEPS: ${{ inputs.steps }}
      RL_SEED: ${{ inputs.seed }}
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'gymnasium[mujoco]==1.3.0' 'mujoco==3.14.0' 'numpy==2.5.3'
          python -c "import gymnasium, mujoco, torch; print('Gymnasium', gymnasium.__version__, 'MuJoCo', mujoco.__version__, 'Torch', torch.__version__)"

      - name: Train and evaluate
        run: |
          python td3_inverted_pendulums.py \
            --env "$RL_ENV" \
            --steps "$RL_STEPS" \
            --seeds "$RL_SEED" \
            --eval-every 10000 \
            --eval-episodes 5 \
            --out results

      - name: Independent 20-episode test
        run: |
          python evaluate_td3.py \
            "results/$RL_ENV/seed$RL_SEED/best.pt" \
            --episodes 20 \
            --seed 300000 \
            --out "results/$RL_ENV/seed$RL_SEED/holdout.json"

      - name: Upload model and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: td3-${{ inputs.environment }}-seed${{ inputs.seed }}-run${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
